name: Daily Sales Navigator → Apollo Pipeline

on:
  # Run every day at 6:00 AM PST (14:00 UTC)
  schedule:
    - cron: "0 14 * * *"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (skip upload)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  scrape-enrich-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Write config.json from secrets
        run: |
          cat <<EOF > config.json
          {
            "linkedin_email": "${{ secrets.LINKEDIN_EMAIL }}",
            "linkedin_password": "${{ secrets.LINKEDIN_PASSWORD }}",
            "sales_nav_search_url": "${{ secrets.SALES_NAV_SEARCH_URL }}",
            "apollo_api_key": "${{ secrets.APOLLO_API_KEY }}",
            "apollo_sequence_id": "${{ secrets.APOLLO_SEQUENCE_ID }}",
            "icp_elite_keywords": ["CEO", "CTO", "CFO", "COO", "Founder", "Co-Founder", "Owner", "President", "Chief"],
            "icp_high_keywords": ["VP", "Vice President", "Director", "Head of", "Senior Manager", "Manager", "Partner"]
          }
          EOF

      - name: Run pipeline
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run
          else
            python main.py
          fi

      - name: Upload leads artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_number }}
          path: |
            leads.json
            leads_enriched.json
            leads_failed_enrichment.json
            upload_log.txt
          retention-days: 30

      - name: Cleanup config
        if: always()
        run: rm -f config.json
